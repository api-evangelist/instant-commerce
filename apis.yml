aid: instant-commerce
name: Instant Commerce
description: >-
  Instant Commerce (product: Instant, instant.so) is an Amsterdam- and
  Miami-based AI-native eCommerce software company that builds an AI-powered,
  no-code page builder for Shopify. Merchants describe what they want and
  Instant's AI agents generate complete store pages — landing pages, homepages,
  product and collection pages, popups and cart drawers — including layouts,
  copy and AI-generated imagery, plus Figma-to-Shopify conversion, A/B testing
  and conversion-rate optimization. The platform serves roughly 25,000 brands.
  Instant's agent surface is a hosted, remote Model Context Protocol (MCP) server
  at api.instant.so/mcp, shipped 2026-06-02 and labelled beta, which lets Claude
  Desktop, Cursor and other MCP clients list, create, edit, publish and unpublish
  landing pages and drive the AI page-builder agent using a project-scoped bearer
  access token issued in the dashboard. There is no OpenAPI, no public REST
  reference and no OAuth; an earlier generation of developer tooling — the
  @instantcommerce/sdk React block SDK, the @instantcommerce/cli and the
  developer docs at docs.instantcommerce.io — is still published but has had no
  release since 2023. The company has raised about $10M and is backed by HV
  Capital. Added to the API Evangelist network as a portfolio-company lead and
  enriched from public sources.
