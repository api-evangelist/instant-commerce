apis:
- aid: instant-commerce:instant-mcp-server
  name: Instant MCP Server
  description: >-
    Hosted, remote Model Context Protocol server that lets external AI clients —
    Claude Desktop, Cursor and other MCP clients — work with an Instant project.
    Documented tools list, create, edit, publish and unpublish landing pages,
    send natural-language instructions to Instant's AI page-builder agent, and
    fetch page details (optionally with a screenshot), project info and the AI
    credit balance. Scope is landing pages ONLY — product and collection
    templates, sections, headers and footers, the cart and the storefront home
    page are explicitly out of scope for agents. Authentication is a
    project-scoped access token created in the dashboard by an owner or admin and
    sent as an HTTP bearer token; there is no OAuth and no discovery metadata.
    Announced 2026-06-02 and labelled a beta feature by the provider. The live
    tool list is auth-gated (401), so tool names and input schemas are not
    enumerated in this profile.
  humanURL: https://docs.instant.so/en/articles/16068062-access-tokens-and-mcp
  baseURL: https://api.instant.so/mcp
