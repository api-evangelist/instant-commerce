aid: instant-commerce
name: Instant Commerce
description: >-
  Instant Commerce (product: Instant, instant.so) is an Amsterdam- and
  Miami-based AI-native eCommerce software company that builds an AI-powered,
  no-code page builder for Shopify. Merchants describe what they want and
  Instant's AI agents generate complete store pages — landing pages, homepages,
  product and collection pages, popups and cart drawers — including layouts,
  copy and AI-generated imagery, plus Figma-to-Shopify conversion, A/B testing
  and conversion-rate optimization. The platform serves roughly 25,000 brands,
  ships an official developer SDK for building custom React blocks, and exposes
  a hosted Model Context Protocol (MCP) server so Claude and other AI tools can
  build pages directly. The company has raised about $10M and is backed by HV
  Capital. Added to the API Evangelist network as a portfolio-company lead and
  enriched from public sources.
